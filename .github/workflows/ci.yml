# Continuous integration for KeyBlaze.
# Runs on pushes to main, on pull requests, on demand, and as the gate of the publish workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Checks and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux and macOS have case-sensitive file systems; Windows is the development platform.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage

  integration:
    name: Integration (${{ matrix.os }}, VS Code ${{ matrix.label }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # stable = current VS Code; minimum = 1.90.0 (package.json engines)
        label: [stable, minimum]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Integration tests (Linux, virtual display)
        if: runner.os == 'Linux'
        # xvfb-run defaults to a 640x480, 8-bit screen: far smaller than any real VS Code window.
        # Placement depends on how many editor lines are visible, so use a realistic display.
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run ${{ matrix.label == 'stable' && 'test:integration' || 'test:min-vscode' }}
      - name: Integration tests
        if: runner.os != 'Linux'
        run: npm run ${{ matrix.label == 'stable' && 'test:integration' || 'test:min-vscode' }}

  package:
    name: Package VSIX
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:prod
      - name: Verify packaged files (allowlist)
        run: node scripts/check-package-files.mjs
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error
